<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ratan Matka Official</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: "Roboto", Arial, sans-serif;
            background: #102b54;
            color: #fff;
            overflow-x: hidden;
            padding-top: 112px;
        }

        /* =========================
           NAVBAR
        ========================= */

        .navbar {
            width: 100%;
            height: 112px;
            display: flex;
            align-items: center;
            padding: 0 7%;
            background: linear-gradient(
                100deg,
                #0c1d38 0%,
                #173b70 45%,
                #2d8ac5 100%
            );

            /* Fixed: navbar remains visible while scrolling */
            position: fixed;
            top: 0;
            left: 0;
            z-index: 9999;

            box-shadow: 0 3px 18px rgba(0, 0, 0, 0.18);
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 30px;
        }

        .logo-box {
            width: 84px;
            height: 68px;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo-box img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .brand {
            display: flex;
            flex-direction: column;
            line-height: 1;
        }

        .brand-name {
            font-size: 27px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #fff;
        }

        .brand-official {
            margin-top: 6px;
            font-size: 15px;
            font-weight: 800;
            color: #21a9ff;
            letter-spacing: 2px;
        }

        /* =========================
           NAVIGATION
        ========================= */

        .nav-menu {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .nav-menu a {
            color: #fff;
            text-decoration: none;
            font-size: 19px;
            font-weight: 600;
            padding: 18px 27px;
            border-radius: 40px;
            transition: 0.3s ease;
            white-space: nowrap;
        }

        .nav-menu a:hover {
            background: rgba(255,255,255,0.10);
        }

        .nav-menu .active {
            background: #2178e7;
            box-shadow: 0 5px 20px rgba(0,0,0,0.12);
        }

        .download-nav {
            background: #2178e7 !important;
            padding-left: 36px !important;
            padding-right: 36px !important;
            margin-left: 15px;
        }

        /* =========================
           HERO
        ========================= */

        .hero {
            min-height: calc(100vh - 112px);
            position: relative;
            overflow: hidden;

            background:
                linear-gradient(
                    110deg,
                    #102a51 0%,
                    #173b70 52%,
                    #2c7eb5 100%
                );
        }

        /* =========================
           DECORATIVE BACKGROUND
        ========================= */

        .shape {
            position: absolute;
            opacity: 0.10;
            color: #d6e7ff;
            font-weight: 900;
            pointer-events: none;
            user-select: none;
            will-change: transform, opacity;

            animation-name: floatingSymbols;
            animation-timing-function: ease-in-out;
            animation-iteration-count: infinite;
        }

        /* Smooth live floating animation */
        @keyframes floatingSymbols {
            0% {
                transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
                opacity: 0.06;
            }

            20% {
                transform: translate3d(25px, -30px, 0) rotate(10deg) scale(1.05);
                opacity: 0.12;
            }

            40% {
                transform: translate3d(-20px, -60px, 0) rotate(-8deg) scale(1);
                opacity: 0.08;
            }

            60% {
                transform: translate3d(-45px, -25px, 0) rotate(15deg) scale(1.08);
                opacity: 0.13;
            }

            80% {
                transform: translate3d(15px, 15px, 0) rotate(-10deg) scale(0.95);
                opacity: 0.07;
            }

            100% {
                transform: translate3d(0, 0, 0) rotate(0deg) scale(1);
                opacity: 0.06;
            }
        }

        .shape.one {
            left: 6%;
            top: 42%;
            font-size: 110px;
            animation-duration: 9s;
        }

        .shape.two {
            left: 26%;
            top: 65%;
            font-size: 45px;
            color: #f2a6bd;
            animation-duration: 6s;
            animation-delay: -2s;
        }

        .shape.three {
            left: 42%;
            top: 45%;
            font-size: 52px;
            color: #f3b51b;
            animation-duration: 8s;
            animation-delay: -4s;
        }

        .shape.four {
            right: 28%;
            top: 20%;
            font-size: 55px;
            animation-duration: 11s;
            animation-delay: -3s;
        }

        .shape.five {
            right: 18%;
            top: 33%;
            font-size: 45px;
            animation-duration: 7s;
            animation-delay: -1s;
        }

        .shape.six {
            right: 6%;
            top: 10%;
            font-size: 48px;
            color: #f2a7b7;
            animation-duration: 10s;
            animation-delay: -5s;
        }

        .shape.seven {
            left: 57%;
            top: 72%;
            font-size: 50px;
            color: #eaa2bf;
            animation-duration: 7.5s;
            animation-delay: -2.5s;
        }

        .shape.eight {
            left: 48%;
            top: 20%;
            font-size: 35px;
            animation-duration: 9.5s;
            animation-delay: -6s;
        }

        /* =========================
           HERO CONTENT
        ========================= */

        .hero-container {
            width: 100%;
            max-width: 1600px;
            min-height: calc(100vh - 112px);
            margin: 0 auto;
            padding: 0 8%;
            display: flex;
            align-items: center;
            position: relative;
            z-index: 5;
        }

        .hero-content {
            width: 58%;
            padding-top: 35px;
            padding-bottom: 60px;
            position: relative;
            z-index: 10;
        }

        .hero-title {
            font-size: clamp(45px, 4.2vw, 66px);
            line-height: 1.12;
            font-weight: 800;
            letter-spacing: -1.5px;
            max-width: 850px;
        }

        .hero-title .blue {
            color: #2181ed;
        }

        .hero-description {
            margin-top: 27px;
            max-width: 720px;
            font-size: 21px;
            line-height: 1.65;
            color: #d7e2f0;
            font-weight: 400;
        }

        /* =========================
           DOWNLOAD BUTTON
        ========================= */

        .download-btn {
            margin-top: 32px;
            width: 438px;
            height: 84px;
            border: none;
            border-radius: 50px;
            background: #2179e7;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 17px;
            font-family: inherit;
            font-size: 23px;
            font-weight: 700;
            cursor: pointer;
            text-decoration: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            transition: 0.3s ease;
        }

        .download-btn:hover {
            background: #3188f4;
            transform: translateY(-3px);
            box-shadow: 0 14px 35px rgba(0,0,0,0.22);
        }

        .download-icon {
            width: 29px;
            height: 29px;
            position: relative;
            display: inline-block;
        }

        .download-icon::before {
            content: "";
            position: absolute;
            left: 13px;
            top: 0;
            width: 3px;
            height: 21px;
            background: #fff;
            border-radius: 4px;
        }

        .download-icon::after {
            content: "";
            position: absolute;
            width: 12px;
            height: 12px;
            border-right: 3px solid #fff;
            border-bottom: 3px solid #fff;
            transform: rotate(45deg);
            left: 8px;
            top: 9px;
        }

        .download-icon span {
            position: absolute;
            width: 27px;
            height: 3px;
            background: #fff;
            border-radius: 3px;
            left: 1px;
            bottom: 0;
        }

        /* =========================
           HERO IMAGE
        ========================= */

        .hero-image {
            position: absolute;
            right: 1%;
            bottom: 0;

            /* Keep the complete girl visible */
            height: calc(100vh - 112px);
            width: auto;
            max-width: none;

            z-index: 8;
            pointer-events: none;
        }

        .hero-image img {
            display: block;
            height: 100%;
            width: auto;
            max-width: none;
            object-fit: contain;
            object-position: bottom center;
        }

        /* =========================
           MOBILE MENU
        ========================= */

        .mobile-menu {
            display: none;
            width: 42px;
            height: 42px;
            border: none;
            background: transparent;
            cursor: pointer;
        }

        .mobile-menu span {
            display: block;
            width: 28px;
            height: 3px;
            background: #fff;
            margin: 5px auto;
            border-radius: 5px;
        }

        /* =========================
           RESPONSIVE
        ========================= */

        @media (max-width: 1200px) {

            .navbar {
                padding: 0 4%;
            }

            .hero-container {
                padding: 0 5%;
            }

            .nav-menu a {
                padding: 15px 18px;
                font-size: 16px;
            }

            .brand-name {
                font-size: 23px;
            }

            .hero-title {
                font-size: 50px;
            }

            .hero-description {
                font-size: 18px;
            }

            .hero-image {
                height: calc(100vh - 112px);
                width: auto;
                max-width: none;
                right: 0;
            }
        }

        @media (max-width: 900px) {

            .navbar {
                height: 88px;
            }

            body {
                padding-top: 88px;
            }

            .nav-left {
                gap: 15px;
            }

            .logo-box {
                width: 65px;
                height: 55px;
            }

            .brand-name {
                font-size: 20px;
            }

            .brand-official {
                font-size: 12px;
            }

            .nav-menu {
                display: none;
            }

            .mobile-menu {
                display: block;
                margin-left: auto;
            }

            .hero {
                min-height: auto;
            }

            .hero-container {
                min-height: auto;
                padding: 70px 7% 0;
                display: block;
            }

            .hero-content {
                width: 100%;
                padding-bottom: 30px;
            }

            .hero-title {
                font-size: 46px;
                max-width: 700px;
            }

            .hero-description {
                max-width: 650px;
            }

            .hero-image {
                position: relative;
                height: auto;
                width: 75%;
                max-width: 650px;
                right: auto;
                margin: 0 auto;
            }

            .hero-image img {
                width: 100%;
                height: auto;
                max-width: 100%;
            }

            .download-btn {
                width: 390px;
            }
        }

        @media (max-width: 600px) {

            .navbar {
                height: 75px;
                padding: 0 20px;
            }

            body {
                padding-top: 75px;
            }

            .logo-box {
                width: 55px;
                height: 47px;
            }

            .brand-name {
                font-size: 17px;
            }

            .brand-official {
                font-size: 10px;
                margin-top: 4px;
            }

            .hero-container {
                padding: 55px 22px 0;
            }

            .hero-title {
                font-size: 38px;
                line-height: 1.13;
                letter-spacing: -0.8px;
            }

            .hero-description {
                margin-top: 20px;
                font-size: 16px;
                line-height: 1.55;
            }

            .download-btn {
                width: 100%;
                height: 68px;
                font-size: 18px;
                margin-top: 25px;
            }

            .hero-image {
                width: 100%;
                height: auto;
                margin-top: 20px;
            }

            .hero-image img {
                width: 100%;
                height: auto;
            }

            .shape.one {
                font-size: 70px;
            }

            .shape.three {
                font-size: 35px;
            }
        }
    </style>
</head>

<body>

    <!-- =========================
         NAVBAR
    ========================== -->

    <header class="navbar">

        <div class="nav-left">

            <div class="logo-box">
                <img src="logo.png" alt="Ratan Matka Logo">
            </div>

            <div class="brand">
                <div class="brand-name">
                    RATAN MATKA
                </div>

                <div class="brand-official">
                    OFFICIAL
                </div>
            </div>

        </div>

        <nav class="nav-menu">

            <a href="#" class="active">
                Home
            </a>

            <a href="#">
                All Charts
            </a>

            <a href="#">
                Game Charts ⚡
            </a>

            <a href="ratan-matka.apk" class="download-nav">
                Download
            </a>

        </nav>

        <button class="mobile-menu">
            <span></span>
            <span></span>
            <span></span>
        </button>

    </header>


    <!-- =========================
         HERO SECTION
    ========================== -->

    <main class="hero">

        <!-- Decorative symbols -->

        <div class="shape one">♢</div>
        <div class="shape two">♥</div>
        <div class="shape three">♙</div>
        <div class="shape four">♧</div>
        <div class="shape five">A♥</div>
        <div class="shape six">♠</div>
        <div class="shape seven">♥</div>
        <div class="shape eight">♤</div>


        <div class="hero-container">

            <!-- LEFT CONTENT -->

            <section class="hero-content">

                <h1 class="hero-title">
                    Trust The Legacy, Play With
                    <br>

                    Pride on
                    <span class="blue">
                        Ratan Matka
                    </span>
                </h1>

                <p class="hero-description">
                    India's most trusted online matka application.
                    Enjoy high winning rates, live charts, and
                    4-minute instant withdrawals.
                </p>

                <a
                    href="ratan-matka.apk"
                    class="download-btn"
                    download
                >

                    <span class="download-icon">
                        <span></span>
                    </span>

                    Download Ratan Matka

                </a>

            </section>


            <!-- RIGHT IMAGE -->

            <div class="hero-image">

                <img
                    src="girl.png"
                    alt="Ratan Matka App"
                >

            </div>

        </div>

    </main>


    <script>

        // Mobile menu
        const mobileMenu = document.querySelector(".mobile-menu");
        const navMenu = document.querySelector(".nav-menu");

        mobileMenu.addEventListener("click", function () {

            if (navMenu.style.display === "flex") {

                navMenu.style.display = "none";

            } else {

                navMenu.style.display = "flex";

                navMenu.style.position = "absolute";
                navMenu.style.top = "75px";
                navMenu.style.left = "0";
                navMenu.style.right = "0";
                navMenu.style.padding = "20px";
                navMenu.style.flexDirection = "column";
                navMenu.style.background = "#12315c";

            }

        });

    </script>

</body>
</html>
